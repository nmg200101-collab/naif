name: Build Appeal Pro APK

on:
  push:
    branches:
      - appeal-pro-v0.3-apk
    paths:
      - 'appeal-pro-source.part.*.b64'
      - '.github/workflows/build-appeal-pro-v0.3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and extract Appeal Pro source
        run: |
          cat appeal-pro-source.part.00.b64 appeal-pro-source.part.01.b64 appeal-pro-source.part.02.b64 appeal-pro-source.part.03.b64 appeal-pro-source.part.04.b64 > appeal-pro-source.b64
          test "$(wc -c < appeal-pro-source.b64)" -eq 34588
          base64 -d appeal-pro-source.b64 > appeal-pro-source.zip
          echo "0db91e94a5407702c5e958d69b0f9b33f603e2f000471fa304f6054a8fd6136f  appeal-pro-source.zip" | sha256sum -c -
          unzip -t appeal-pro-source.zip
          unzip -q appeal-pro-source.zip

      - name: Build debug APK
        working-directory: AppealPro_V0.3
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp AppealPro_V0.3/app/build/outputs/apk/debug/app-debug.apk AppealPro-V0.3-debug.apk

      - name: Verify APK
        run: |
          test -s AppealPro-V0.3-debug.apk
          sha256sum AppealPro-V0.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V0.3-APK
          path: AppealPro-V0.3-debug.apk
          if-no-files-found: error
