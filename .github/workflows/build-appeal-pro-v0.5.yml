name: Build Appeal Pro V0.5 APK

on:
  push:
    branches:
      - appeal-pro-v0.5-support-inbox
    paths:
      - 'appeal-v05.part.*.b64'
      - '.github/workflows/build-appeal-pro-v0.5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and verify V0.5 source
        run: |
          cat appeal-v05.part.00.b64 appeal-v05.part.01.b64 appeal-v05.part.02.b64 appeal-v05.part.03.b64 appeal-v05.part.04.b64 appeal-v05.part.05.b64 appeal-v05.part.06.b64 > AppealPro_V0.5_Source.zip.b64
          test "$(wc -c < AppealPro_V0.5_Source.zip.b64)" -eq 51980
          base64 -d AppealPro_V0.5_Source.zip.b64 > AppealPro_V0.5_Source.zip
          echo "e75ad8e656649b0d2f7096417f9ae1c9a052f4d3e2ab14c5b0afbc4ec4d7d81b  AppealPro_V0.5_Source.zip" | sha256sum -c -
          unzip -t AppealPro_V0.5_Source.zip
          unzip -q AppealPro_V0.5_Source.zip

      - name: Build debug APK
        working-directory: AppealPro_V0.5
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp AppealPro_V0.5/app/build/outputs/apk/debug/app-debug.apk AppealPro-V0.5-debug.apk

      - name: Verify APK
        run: |
          test -s AppealPro-V0.5-debug.apk
          sha256sum AppealPro-V0.5-debug.apk
          ls -lh AppealPro-V0.5-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V0.5-APK
          path: AppealPro-V0.5-debug.apk
          if-no-files-found: error
          retention-days: 30
