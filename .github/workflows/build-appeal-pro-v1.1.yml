name: Build Appeal Pro V1.1 Structured Final APK

on:
  push:
    branches:
      - appeal-pro-v1.1-structured-final
    paths:
      - 'appeal-v11.part.*.b64'
      - '.github/workflows/build-appeal-pro-v1.1.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct and verify V1.1 source
        run: |
          cat appeal-v11.part.00.b64 appeal-v11.part.01.b64 appeal-v11.part.02.b64 appeal-v11.part.03.b64 appeal-v11.part.04.b64 appeal-v11.part.05.b64 appeal-v11.part.06.b64 appeal-v11.part.07.b64 > AppealPro_V1.1_Final_Source.zip.b64
          test "$(wc -c < AppealPro_V1.1_Final_Source.zip.b64)" -eq 62112
          base64 -d AppealPro_V1.1_Final_Source.zip.b64 > AppealPro_V1.1_Final_Source.zip
          echo "aa6b3b49b1d2d969fb172f1ccff0dbc9f19b25ea9cca1489574e2850ba1805a9  AppealPro_V1.1_Final_Source.zip" | sha256sum -c -
          unzip -t AppealPro_V1.1_Final_Source.zip
          unzip -q AppealPro_V1.1_Final_Source.zip

      - name: Build V1.1 debug APK
        working-directory: AppealPro_V1.1
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp AppealPro_V1.1/app/build/outputs/apk/debug/app-debug.apk AppealPro-V1.1-Structured-Final-debug.apk

      - name: Verify APK
        run: |
          test -s AppealPro-V1.1-Structured-Final-debug.apk
          sha256sum AppealPro-V1.1-Structured-Final-debug.apk
          ls -lh AppealPro-V1.1-Structured-Final-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V1.1-Structured-Final-APK
          path: AppealPro-V1.1-Structured-Final-debug.apk
          if-no-files-found: error
          retention-days: 30
