name: Build Appeal Pro V2.0.1 Verification Recovery

on:
  push:
    branches:
      - appeal-pro-v2-doctor-mode
    paths:
      - 'appeal-v20-doctor.patch.gz.b64'
      - 'appeal-v20-doctor.patch.0.b64'
      - 'appeal-v20-doctor.patch.1.b64'
      - 'appeal-v20-phase1.patch.*.b64'
      - 'appeal-v201-verification-recovery.patch.gz.b64'
      - '.github/workflows/build-appeal-pro-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct V1.2
        run: |
          cat appeal-v12.part.00.b64 appeal-v12.part.01.b64 appeal-v12.part.02.b64 appeal-v12.part.03.b64 appeal-v12.part.04.b64 appeal-v12.part.05.b64 appeal-v12.part.06.b64 appeal-v12.part.07.b64 appeal-v12.part.08.b64 > AppealPro_V1.2_Final_Source.zip.b64
          base64 -d AppealPro_V1.2_Final_Source.zip.b64 > AppealPro_V1.2_Final_Source.zip
          echo "22a50d76eed41d888c492a147a6aacedc4aa7f827c73702255473411ad6e7af4  AppealPro_V1.2_Final_Source.zip" | sha256sum -c -
          unzip -q AppealPro_V1.2_Final_Source.zip

      - name: Apply V1.3 to V1.5
        run: |
          cp -a AppealPro_V1.2 AppealPro_V1.3
          cat appeal-v13.patch.0.b64 appeal-v13.patch.1.b64 appeal-v13.patch.2.b64 appeal-v13.patch.3.b64 appeal-v13.patch.4.b64 | base64 -d | gzip -d > /tmp/v13.patch
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v13.patch)
          base64 -d appeal-v14.patch.gz.b64 | gzip -d > /tmp/v14.patch
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v14.patch)
          cat appeal-v15.patch.0.b64 appeal-v15.patch.1.b64 appeal-v15.patch.2.b64 | base64 -d | gzip -d > /tmp/v15.patch
          (cd AppealPro_V1.3 && patch -p5 < /tmp/v15.patch)
          sed -i 's/a3b794c6b9145d0e15d290df16e83a54ef3011c73e5cefe1adfafd64807dda01/5a7028932d35a424c20664dbc44885faca70d9eee40e786c9ca35cc9a95da4f0/g' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/SignatureGuard.kt

      - name: Apply V1.6
        run: |
          cat appeal-v16.patch.0.b64 appeal-v16.patch.1.b64 | base64 -d | gzip -d > /tmp/v16.patch
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v16.patch)
          base64 -d appeal-v16.beta.patch.gz.b64 | gzip -d > /tmp/v16beta.patch
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v16beta.patch)

      - name: Apply V2 Doctor Mode
        run: |
          cat appeal-v20-doctor.patch.0.b64 appeal-v20-doctor.patch.1.b64 | base64 -d | gzip -d > /tmp/v20.patch
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v20.patch)

      - name: Apply V2 Doctor Mode Phase 1
        run: |
          cat appeal-v20-phase1.patch.0.b64 appeal-v20-phase1.patch.1.b64 appeal-v20-phase1.patch.2.b64 appeal-v20-phase1.patch.3.b64 > /tmp/v20-phase1.patch.gz.b64
          echo "dc41508e9466a3a47b394dac11f669aeb97d642e62c0ca4804d60e337682d27c  /tmp/v20-phase1.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/v20-phase1.patch.gz.b64 | gzip -d > /tmp/v20-phase1.patch
          echo "26319515508f4afba1fbe81183ca9ff0ea26bd2adbfe810257549d9fa1e33794  /tmp/v20-phase1.patch" | sha256sum -c -
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v20-phase1.patch)

      - name: Apply V2.0.1 verification recovery
        run: |
          echo "202f4be37d9f350c824b0feb0316d8e5ad2034675199d7016ee895f864588919  appeal-v201-verification-recovery.patch.gz.b64" | sha256sum -c -
          base64 -d appeal-v201-verification-recovery.patch.gz.b64 | gzip -d > /tmp/v201-verification-recovery.patch
          echo "d4ad61766978e0d014774dcc2846f40ad1e166459700a99a07a61f802fd09a3f  /tmp/v201-verification-recovery.patch" | sha256sum -c -
          (cd AppealPro_V1.3 && patch -p1 < /tmp/v201-verification-recovery.patch)

      - name: Verify V2.0.1 recovery source contracts
        run: |
          grep -q 'versionCode = 22' AppealPro_V1.3/app/build.gradle.kts
          grep -q 'versionName = "2.0.1-verification-recovery"' AppealPro_V1.3/app/build.gradle.kts
          grep -q 'object VerificationRecoveryProtocol' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/VerificationRecoveryProtocol.kt
          grep -q 'المسار الشائع — استعادة كود واتساب' AppealPro_V1.3/app/src/main/java/com/appealpro/app/ui/AppealProApp.kt
          grep -q 'WARP/1.1.1.1 اختبار اختياري لمسار الإنترنت فقط' AppealPro_V1.3/app/src/main/java/com/appealpro/app/ui/AppealProApp.kt
          grep -q 'object ResponseRouter' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/ResponseRouter.kt
          grep -q 'object CaseStateMachine' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/CaseStateMachine.kt
          grep -q 'ACTION_REQUIRED' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/Models.kt
          grep -q 'FOLLOW_UP_READY' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/Models.kt
          grep -q 'FOLLOW_UP_SENT' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/Models.kt
          grep -q 'RESPONSE_RECEIVED' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/Models.kt
          grep -q 'replyToSameEmailAllowed' AppealPro_V1.3/app/src/main/java/com/appealpro/app/data/Models.kt
          grep -q 'GuidedSupportFormCard' AppealPro_V1.3/app/src/main/java/com/appealpro/app/ui/AppealProApp.kt
          grep -q 'متابعة الحل' AppealPro_V1.3/app/src/main/java/com/appealpro/app/ui/AppealProApp.kt

      - name: Build V2.0.1 beta and release
        working-directory: AppealPro_V1.3
        run: |
          gradle --no-daemon :app:assembleDebug
          gradle --no-daemon :app:assembleRelease

      - name: Collect artifacts
        run: |
          DEBUG=$(find AppealPro_V1.3/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          RELEASE=$(find AppealPro_V1.3/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -s "$DEBUG"
          test -s "$RELEASE"
          cp "$DEBUG" AppealPro-V2.0.1-Verification-Recovery-BETA.apk
          cp "$RELEASE" AppealPro-V2.0.1-Verification-Recovery-unsigned.apk
          (cd AppealPro_V1.3 && zip -qr ../AppealPro_V2.0.1_Verification_Recovery_Source.zip .)
          sha256sum AppealPro-V2.0.1-Verification-Recovery-BETA.apk AppealPro-V2.0.1-Verification-Recovery-unsigned.apk AppealPro_V2.0.1_Verification_Recovery_Source.zip
          ls -lh AppealPro-V2.0.1-Verification-Recovery-BETA.apk AppealPro-V2.0.1-Verification-Recovery-unsigned.apk AppealPro_V2.0.1_Verification_Recovery_Source.zip

      - name: Upload beta
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V2.0.1-Verification-Recovery-BETA
          path: AppealPro-V2.0.1-Verification-Recovery-BETA.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V2.0.1-Verification-Recovery-Unsigned
          path: AppealPro-V2.0.1-Verification-Recovery-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AppealPro-V2.0.1-Verification-Recovery-Source
          path: AppealPro_V2.0.1_Verification_Recovery_Source.zip
          if-no-files-found: error
          retention-days: 30
