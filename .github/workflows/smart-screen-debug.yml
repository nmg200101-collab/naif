name: Smart Control V1.1.0 RC Android APK
on:
  push:
    branches: [build/smart-control-v1.1.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract verified source
        run: tar -xJf source.tar.xz
      - name: Apply v0.3.0 compact tools and native 3x3 pattern
        shell: bash
        run: |
          set -euo pipefail
          cat .github/screen-updates/main.kt.xz.b64.part{1,2,3,4} | base64 --decode | xz --decompress > app/src/main/java/com/smartscreen/control/MainActivity.kt
          echo 'd3a55120e17f6250f359520605cec83ff7d5459bdd78f32b1e8c951d316598b4  app/src/main/java/com/smartscreen/control/MainActivity.kt' | sha256sum --check
          sed -i 's/fillViewport =/isFillViewport =/g' app/src/main/java/com/smartscreen/control/MainActivity.kt
          sed -i -e 's/versionCode = 2/versionCode = 3/' -e 's/versionName = "0.2.0"/versionName = "0.3.0"/' app/build.gradle.kts
      - name: Apply verified v0.4.0 native RTL premium dashboard
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/screen-updates/v0.4-overlay.tar.xz.b64 > /tmp/v0.4-overlay.tar.xz
          echo '1cd46b6cca88171c6cfca019e82d4aa33984ca23f032b1030748c26a0213f0af  /tmp/v0.4-overlay.tar.xz' | sha256sum --check
          tar -xJf /tmp/v0.4-overlay.tar.xz
          grep -q 'التحكم الذكي' app/src/main/java/com/smartscreen/control/MainActivity.kt
          grep -q 'android:label="التحكم الذكي"' app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 4' app/build.gradle.kts
      - name: Apply V1.1.0 real internet dashboard and secure VPN blocker
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/screen-updates/v1.1-overlay.tar.xz.b64 > /tmp/smart-control-v1.1-overlay.tar.xz
          echo 'd7b102a79e056aa45ff281ed51ad157e01ea4dadff8d267c30a34952e4513486  /tmp/smart-control-v1.1-overlay.tar.xz' | sha256sum --check
          tar -xJf /tmp/smart-control-v1.1-overlay.tar.xz
          grep -q 'versionCode = 11' app/build.gradle.kts
          grep -q 'versionName = "1.1.0"' app/build.gradle.kts
          grep -q 'InternetFirewallVpnService' app/src/main/AndroidManifest.xml
          grep -q 'PACKAGE_USAGE_STATS' app/src/main/AndroidManifest.xml
          grep -q 'التحكم الذكي' app/src/main/AndroidManifest.xml
      - name: Unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartControl-v1.1.0-rc1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK for direct browser download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/SmartControl-V1.1.0-RC1.apk
          sha256sum downloads/SmartControl-V1.1.0-RC1.apk > downloads/SmartControl-V1.1.0-RC1.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SmartControl-V1.1.0-RC1.apk downloads/SmartControl-V1.1.0-RC1.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Smart Control v1.1.0 RC APK [skip ci]"
            git push origin HEAD:build/smart-control-v1.1.0
          fi

      - name: Publish stable GitHub Release installer (pre-release)
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="smart-control-v1.1.0-rc1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/SmartControl-V1.1.0-RC1.apk downloads/SmartControl-V1.1.0-RC1.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" downloads/SmartControl-V1.1.0-RC1.apk downloads/SmartControl-V1.1.0-RC1.apk.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "التحكم الذكي 1.1.0 · إصدار تجريبي متقدم" --notes-file RELEASE_NOTES_V1.1.0.md --prerelease
          fi
