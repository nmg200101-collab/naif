name: Smart Screen Control APK
on:
  push:
    branches: [build/smart-screen-control-v0.2.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract verified source
        run: tar -xJf source.tar.xz
      - name: Apply v0.3.0 compact tools and native 3x3 pattern
        shell: bash
        run: |
          set -euo pipefail
          cat .github/screen-updates/main.kt.xz.b64.part{1,2,3,4} | base64 --decode | xz --decompress > app/src/main/java/com/smartscreen/control/MainActivity.kt
          echo 'd3a55120e17f6250f359520605cec83ff7d5459bdd78f32b1e8c951d316598b4  app/src/main/java/com/smartscreen/control/MainActivity.kt' | sha256sum --check
          sed -i 's/fillViewport =/isFillViewport =/g' app/src/main/java/com/smartscreen/control/MainActivity.kt
          sed -i -e 's/versionCode = 2/versionCode = 3/' -e 's/versionName = "0.2.0"/versionName = "0.3.0"/' app/build.gradle.kts
      - name: Unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartScreenControl-v0.3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK for direct browser download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/SmartScreenControl-V0.3.0-debug.apk
          sha256sum downloads/SmartScreenControl-V0.3.0-debug.apk > downloads/SmartScreenControl-V0.3.0-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SmartScreenControl-V0.3.0-debug.apk downloads/SmartScreenControl-V0.3.0-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Smart Screen Control v0.3.0 APK [skip ci]"
            git push origin HEAD:build/smart-screen-control-v0.2.0
          fi
