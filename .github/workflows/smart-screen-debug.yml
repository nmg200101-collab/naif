name: Smart Screen Control APK
on:
  push:
    branches: [build/smart-screen-control-v0.2.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract verified source
        run: tar -xJf source.tar.xz
      - name: Unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartScreenControl-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
