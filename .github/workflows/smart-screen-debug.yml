name: Smart Control V0.8.0 APK
on:
  push:
    branches: [build/smart-control-v0.8.0]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract verified source
        run: tar -xJf source.tar.xz
      - name: Apply simplified interface and validate resources
        run: |
          python3 tools/simplify_ui_v03.py
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          xml=Path('app/src/main/res/layout/activity_main.xml').read_text()
          main=Path('app/src/main/java/com/smartscreen/control/MainActivity.kt').read_text()
          ET.fromstring(xml)
          ids=set(re.findall(r'@\+id/(\w+)',xml))
          assert set(re.findall(r'R\.id\.(\w+)',main))<=ids
          assert xml.index('مدة تشغيل الشاشة') < xml.index('النقر المزدوج') < xml.index('الخيارات الأخرى')
          assert 'visibility="gone"' in xml
          print('Simplified UI: XML / IDs / sequence OK')
          PY
      - name: Apply professional tabs and night dim filter
        run: python3 tools/upgrade_v04.py
      - name: Apply Smart Control light visual and internet manager
        run: python3 v05/upgrade.py
      - name: Install background network protection and tests
        run: python3 v07/install.py
      - name: Install daily data budgets and regression checks
        run: python3 v08/install.py
      - name: Verify bulk-selection, internet usage and VPN tab source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("app/src/main/java/com/smartscreen/control/InternetPanel.kt").read_text()
          for text in ["تحديد الكل", "إلغاء التحديد", "حظر كامل للمحدد", "السماح للمحدد", "حظر الخلفية للمحدد فقط", "VPN التسريع", "آخر 7 أيام", "querySummary", "renderUsageRows"]:
              assert text in source, text
          print("Selection, VPN and per-app stats wiring: OK")
          PY
      - name: Unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Store installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartControl-v0.8.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK for direct browser download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/SmartControl-V0.8.0-debug.apk
          sha256sum downloads/SmartControl-V0.8.0-debug.apk > downloads/SmartControl-V0.8.0-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/SmartControl-V0.8.0-debug.apk downloads/SmartControl-V0.8.0-debug.apk.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: publish Smart Screen Control v0.8.0 APK [skip ci]"
            git push origin HEAD:build/smart-control-v0.8.0
          fi
