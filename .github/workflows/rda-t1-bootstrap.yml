name: RDA T1 Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T1 branch
        uses: actions/checkout@v4
        with:
          ref: rda-t1-foundation
          fetch-depth: 0

      - name: Expand current RDA package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "RealDrivingAcademy_Prototype" ]; then
            unzip -o RealDrivingAcademy_Stage2_CI_Safe.zip
          fi
          test -f RealDrivingAcademy_Prototype/ProjectSettings/ProjectVersion.txt

      - name: Verify baseline only
        shell: bash
        run: |
          set -euo pipefail
          test -d RealDrivingAcademy_Prototype/Assets/RealDrivingAcademy
          grep -q "2022.3.62f1" RealDrivingAcademy_Prototype/ProjectSettings/ProjectVersion.txt
          echo "RDA T1 baseline is present and structurally valid."
