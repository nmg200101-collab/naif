name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Real Driving Academy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Unity project
        run: |
          mkdir -p UnityProject
          unzip -o RealDrivingAcademy_Stage2_CI_Safe.zip -d UnityProject

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: UnityProject
          targetPlatform: Android
          unityVersion: 2022.3.62f1
          buildMethod: BuildAndroid.BuildAPK

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealDrivingAcademy-Android
          path: UnityProject/Builds/Android/*.apk
          if-no-files-found: error
