name: RDA T3 Static Check

on:
  push:
    branches:
      - rda-t3-training-lessons
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout T3 branch
        uses: actions/checkout@v4

      - name: Verify T3 training stages
        run: python3 Tools/t3_static_check.py
